name: Daily news briefing

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 czasu zimowego w Polsce (08:00 latem)
  workflow_dispatch:       # pozwala uruchomić ręcznie przyciskiem "Run workflow"

permissions:
  contents: write          # potrzebne, żeby zapisać briefing w repozytorium

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        run: python news_agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save briefing to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md briefings/
          git diff --cached --quiet || git commit -m "Briefing $(date +%F)"
          git push
